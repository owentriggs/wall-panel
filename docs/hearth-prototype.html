<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hearth Wall Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<!-- AUTHORITATIVE design + Settings reference prototype (Owen's "Hearth Wall Panel (1).html").
     Port the Settings system (CSS "/* settings */", the "SETTINGS" JS section, and the extra
     sprite icons) into the Preact app in src/. Feed the entity picker from LIVE Home Assistant
     entities, NOT the hardcoded HA[] catalog below. See HANDOFF.md Task 2. -->
<style>
/* Layout: one fixed 1280x800 frame scaled to fit, no top bar. Five tabs (Home, Rooms, Lights, Media, Scenes) share one bottom dock that is always visible; swipe moves between tabs. Solid background, flat solid cards, one corner radius everywhere, no outlines. Demo controls live outside the frame. */
:root{
  --outer:#070A0A; --bg:#0D1111; --card:#171D1D; --card-2:#212929; --sel:#2C3636; --track:#2C3636;
  --ink:#ECF1F0; --ink-2:#B0BCBA; --ink-3:#8A9896;
  --accent:#8DBFB4; --accent-ink:#0A1412;
  --glow:#E8C27A; --glow-ink:#241A06;
  --R:22px;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --outer:#C9D2D0; --bg:#E6EBEA; --card:#FFFFFF; --card-2:#EFF3F2; --sel:#DFE7E5; --track:#D3DCDA;
  --ink:#10201F; --ink-2:#3A4E4B; --ink-3:#586D6A;
  --accent:#2F6F66; --accent-ink:#FFFFFF; --glow:#E0A94A; --glow-ink:#2A1A00;
  color-scheme:light}}
:root[data-theme="light"]{
  --outer:#C9D2D0; --bg:#E6EBEA; --card:#FFFFFF; --card-2:#EFF3F2; --sel:#DFE7E5; --track:#D3DCDA;
  --ink:#10201F; --ink-2:#3A4E4B; --ink-3:#586D6A;
  --accent:#2F6F66; --accent-ink:#FFFFFF; --glow:#E0A94A; --glow-ink:#2A1A00;
  color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--ink);font:20px/1.35 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}

#vp{height:100%;display:flex;flex-direction:column;gap:10px}
#fit{position:relative;flex:1;min-height:0}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform:translate(-50%,-50%) scale(var(--s,1));border-radius:32px;overflow:hidden;background:var(--bg);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.card{background:var(--card);border-radius:var(--R)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 24px;border-radius:var(--R);background:var(--card-2);font-weight:600;font-size:20px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:active,.tile-hit:active,.rchip:active,.dock-btn:active,.scn:active,.sc:active,.round:active{transform:scale(.97)}
.round{width:64px;height:64px;border-radius:20px;background:var(--card-2);display:grid;place-items:center;flex:none;transition:transform .12s}
.round.solid{background:var(--ink);color:var(--bg)}
.round.big{width:96px;height:96px;border-radius:30px}
.round.big .ic{width:42px;height:42px}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.push{margin-top:auto}
.lab{font-size:17px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.h3{font:600 28px var(--f-display);letter-spacing:-.01em}


.home{display:grid;grid-template-columns:376px minmax(0,1fr);gap:12px;height:100%}
.hero{padding:32px;display:flex;flex-direction:column;min-width:0}
.hero .time{font:500 100px/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .date{font-size:24px;color:var(--ink-2);margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-radius:16px;background:var(--card-2);font-size:20px;font-weight:500;margin-top:22px;align-self:flex-start}
.chip .ic{width:24px;height:24px}
.hero .status{margin-top:auto;display:grid;gap:14px}
.hero .status h2{font:500 36px/1.1 var(--f-display);letter-spacing:-.02em}
.srow{display:flex;gap:14px;align-items:center;font-size:21px;color:var(--ink-2)}
.srow .ic{color:var(--ink)}
.hero .btn{margin-top:6px;width:100%}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1.45fr) minmax(0,1fr);gap:12px;min-width:0}
.tile{position:relative;padding:28px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tile-hit{position:absolute;inset:0;border-radius:var(--R);transition:transform .12s}
.tile>*:not(.tile-hit){position:relative;pointer-events:none}
.tile .act{pointer-events:auto}
.tile .tic{width:76px;height:76px;border-radius:24px;background:var(--card-2);display:grid;place-items:center;transition:background .3s,color .3s}
.tile .tic .ic{width:38px;height:38px}
.tile.on .tic{background:var(--ink);color:var(--bg)}
.tile .tt{font:500 34px var(--f-display);letter-spacing:-.01em}
.tile .ts{font-size:22px;color:var(--ink-2);margin-top:2px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.pill{height:42px;padding:0 16px;border-radius:14px;background:var(--card-2);color:var(--ink-3);font-size:18px;font-weight:600;display:inline-flex;align-items:center;transition:background .25s,color .25s}
.pill.on{background:var(--sel);color:var(--ink)}
.art{width:92px;height:92px;border-radius:18px;flex:none;display:block}
.prog{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:4px}
.ctl{display:flex;gap:10px}
.ctl .round{width:60px;height:60px}
.scrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:auto}
.sc{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;height:128px;padding:16px;border-radius:18px;background:var(--card-2);font-weight:600;font-size:19px;line-height:1.15;transition:transform .12s,background .25s}
.sc.cur{background:var(--sel)}

.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;height:100%}
.rcard{padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rh{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.rh h3{font:500 28px var(--f-display);letter-spacing:-.01em}
.rh p{font-size:19px;color:var(--ink-2)}
.rl{display:flex;flex-direction:column;gap:8px}
.rchip{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px 0 10px;border-radius:18px;background:var(--card-2);transition:background .25s,transform .12s;min-width:0}
.rchip .tic{width:44px;height:44px;border-radius:14px;background:var(--track);display:grid;place-items:center;flex:none;transition:background .3s,color .3s}
.rchip .tic .ic{width:24px;height:24px}
.rchip.on{background:var(--sel)}
.rchip.on .tic{background:var(--lc,var(--ink));color:var(--glow-ink)}
.rchip .rn{flex:1;min-width:0;font-size:21px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip .rs{font:400 18px var(--f-mono);color:var(--ink-2)}

.view{position:absolute;left:32px;right:32px;top:32px;bottom:132px;min-height:0;will-change:transform}
.view.slide-l{animation:sl .32s cubic-bezier(.2,.8,.2,1)}
.view.slide-r{animation:sr .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
.dock{z-index:36;position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:8px;padding:10px;border-radius:var(--R);background:var(--card)}
.dock-btn{height:68px;min-width:68px;padding:0 20px;border-radius:calc(var(--R) - 6px);display:flex;align-items:center;justify-content:center;gap:12px;font-weight:600;font-size:21px;color:var(--ink-2);transition:background .25s,color .25s,transform .12s}
.dock-btn.cur{background:var(--sel);color:var(--ink)}
.dock-btn .lb{display:none}
.dock-btn.cur .lb{display:inline}

.split{display:grid;gap:12px;height:100%;min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.pad{padding:26px}
.rail{display:flex;flex-direction:column;gap:6px;padding:12px;height:100%}
.rail-item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:68px;padding:0 20px;border-radius:calc(var(--R) - 6px);font-size:22px;font-weight:600}
.rail-item small{font-size:18px;font-weight:500;color:var(--ink-3)}
.rail-item.cur{background:var(--sel)}
.rail-item.cur small{color:var(--ink-2)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:12px;min-width:0}
.cards.scroll{overflow-y:auto;scrollbar-width:none;align-content:start;touch-action:pan-y}
.lc{padding:22px 24px;display:flex;flex-direction:column;min-width:0}
.lc .head{display:flex;align-items:center;gap:16px}
.lc .tic{width:68px;height:68px;border-radius:22px;background:var(--card-2);display:grid;place-items:center;flex:none;transition:background .3s,color .3s}
.lc.on .tic{background:var(--lc,var(--glow));color:var(--glow-ink)}
.lc .nm{font-size:23px;font-weight:600;line-height:1.15}
.lc .rm{font-size:18px;color:var(--ink-3)}
.lc .pc{font:500 52px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:auto}
.lc .pc small{font:500 22px var(--f-body);color:var(--ink-2)}
.lc .pc .off{color:var(--ink-3)}
.lc.tall .pc{font-size:76px}
.lc.tall .tic{width:84px;height:84px;border-radius:26px}
.lc.tall .tic .ic{width:40px;height:40px}
.lc.tall .nm{font-size:27px}
.lc.tall .seg{margin-top:12px}
.lc.tall .seg button{height:64px}
.seg{display:flex;gap:8px;margin-top:8px}
.seg button{flex:1;height:52px;border-radius:16px;background:var(--card-2);text-align:center;font-weight:600;font-size:19px}
.seg button.cur{background:var(--sel);color:var(--ink)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:60px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y;display:block}
.rng::-webkit-slider-runnable-track{height:18px;border-radius:9px;background:linear-gradient(to right,var(--fill,var(--accent)) var(--p,50%),var(--track) var(--p,50%))}
.rng::-moz-range-track{height:18px;border-radius:9px;background:linear-gradient(to right,var(--fill,var(--accent)) var(--p,50%),var(--track) var(--p,50%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:42px;height:42px;margin-top:-12px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.rng::-moz-range-thumb{width:42px;height:42px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sw{width:76px;height:44px;border-radius:22px;background:var(--track);position:relative;flex:none;transition:background .2s;display:block}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(32px)}
.swb{display:inline-flex;min-width:76px;min-height:60px;align-items:center;justify-content:center}
.bar{flex:none;height:92px;padding:0 14px 0 28px;display:flex;align-items:center;gap:10px}
.bar .btn{min-height:64px;padding:0 20px;font-size:19px}

.scn{padding:28px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;transition:transform .12s,background .25s}
.scn .tic{width:76px;height:76px;border-radius:24px;background:var(--card-2);display:grid;place-items:center}
.scn .tic .ic{width:38px;height:38px}
.scn b{display:block;font:500 32px var(--f-display);letter-spacing:-.01em}
.scn p{font-size:19px;color:var(--ink-2);line-height:1.3;margin-top:6px}
.scn.cur{background:var(--sel)}
.scn.cur .tic{background:var(--ink);color:var(--bg)}

.np{padding:28px;display:flex;flex-direction:column;gap:16px}
.np .art{width:226px;height:226px;border-radius:26px;margin:0 auto}
.np .tt{font:500 38px/1.1 var(--f-display);letter-spacing:-.02em;text-align:center}
.np .ar{font-size:23px;color:var(--ink-2);text-align:center;margin-top:-8px}
.np .times{display:flex;justify-content:space-between;font:400 18px var(--f-mono);color:var(--ink-3);margin-top:-8px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:auto}
.ctrl .round{width:72px;height:72px;border-radius:24px}
.ctrl .play{width:96px;height:96px;border-radius:32px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.ctrl .play .ic{width:42px;height:42px}
.ctrl .round.on{background:var(--sel);color:var(--ink)}
.zrow{display:flex;align-items:center;gap:18px;height:76px}
.zrow .zt{width:150px;flex:none}
.zrow .zt b{display:block;font-size:23px;font-weight:600}
.zrow .zt span{font-size:18px;color:var(--ink-2)}
.zrow .round{width:60px;height:60px;border-radius:19px}
.zrow .round.on{background:var(--ink);color:var(--bg)}
.trk{display:flex;align-items:center;gap:16px;height:62px;width:100%;border-radius:16px;padding:0 6px;transition:background .2s}
.trk:hover{background:var(--card-2)}
.trk .art{width:52px;height:52px;border-radius:12px}
.trk b{display:block;font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk span{font-size:18px;color:var(--ink-2)}
.trk .mono{font-size:17px;color:var(--ink-3)}

.toast{position:absolute;left:50%;bottom:130px;transform:translate(-50%,20px);opacity:0;visibility:hidden;transition:.25s;z-index:45;display:flex;align-items:center;gap:18px;padding:10px 10px 10px 26px;border-radius:var(--R);background:var(--ink);color:var(--bg);font-size:21px;font-weight:500;white-space:nowrap}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.toast button{display:flex;align-items:center;gap:8px;height:52px;padding:0 20px;border-radius:16px;background:rgba(127,127,127,.25);color:var(--bg);font-weight:600}
.ambient{position:absolute;inset:0;z-index:100;background:#000;opacity:0;visibility:hidden;transition:opacity 1.2s,visibility 1.2s;color:#d9e6e3}
.ambient.show{opacity:1;visibility:visible}
.ambient .drift{position:absolute;left:50%;top:50%;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px)));text-align:center;transition:transform 8s ease-in-out;opacity:.8}
.ambient .t{font:500 190px/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ambient .d{font-size:32px;margin-top:10px;opacity:.7}
.ambient .a{display:flex;gap:14px;justify-content:center;margin-top:30px;font-size:22px;opacity:.65}

#demo{flex:none;height:36px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--ink-3)}
#demo span{margin-right:8px;letter-spacing:.08em;text-transform:uppercase;font-size:12px;font-weight:600}
#demo button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;font-size:14px;color:var(--ink-2);font-weight:500}
#demo button:hover{background:var(--card)}
#demo .ic{width:16px;height:16px}
.hint{position:fixed;inset:0;z-index:200;display:none;place-items:center;text-align:center;padding:24px;background:var(--outer);font-size:18px;color:var(--ink-2)}
@media (orientation:portrait) and (max-width:700px){.hint{display:grid}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.roomview{display:grid;grid-template-columns:340px minmax(0,1.1fr) minmax(0,1fr);gap:12px;height:100%;min-width:0}
.rname{font:500 46px/1.05 var(--f-display);letter-spacing:-.02em;margin-top:6px}
.occ{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-left:10px;flex:none}
.occ.off{background:var(--track)}
.chip .occ{margin:0}
.bignum{font:500 84px/1 var(--f-display);letter-spacing:-.03em;margin-top:12px;font-variant-numeric:tabular-nums}
.bignum small{font:500 30px var(--f-body);color:var(--ink-2);margin-left:6px;letter-spacing:0}
.bigmsg{flex:1;display:grid;place-items:center;text-align:center;color:var(--ink-3);gap:8px;align-content:center}
.bigmsg .ic{width:44px;height:44px}
.bigmsg p{font-size:21px}
.zrow.cmp{height:68px}
.zrow.lt .round.on{background:var(--lc);color:var(--glow-ink)}
.chart{width:100%;height:100%;display:block}
.ax{fill:var(--ink-3);font:15px var(--f-mono)}
.spark{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.spark-f{fill:color-mix(in srgb,var(--accent) 16%,transparent)}
.mbar{fill:var(--track)}
.mbar.now{fill:var(--accent)}
.picker-scrim{position:absolute;inset:0;z-index:30}
.picker{position:absolute;left:50%;bottom:128px;transform:translateX(-50%);z-index:35;display:flex;gap:8px;padding:10px;animation:rise .28s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 18px 50px -20px rgba(0,0,0,.6)}
@keyframes rise{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.rbtn{width:206px;height:92px;padding:0 18px;border-radius:calc(var(--R) - 6px);background:var(--card-2);display:flex;flex-direction:column;justify-content:center;gap:4px;transition:background .2s,transform .12s}
.rbtn:active{transform:scale(.97)}
.rbtn.cur{background:var(--sel)}
.rbtn b{font-size:22px;font-weight:600;display:flex;align-items:center}
.rbtn span{font-size:18px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* media v2 */
.spks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.spk{background:var(--card-2);border-radius:calc(var(--R) - 6px);padding:14px;display:flex;flex-direction:column;gap:10px;transition:background .2s}
.spk.on{background:var(--sel)}
.spk-b{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:60px;text-align:left}
.spk-b .ic{width:30px;height:30px;margin-bottom:4px;color:var(--ink-3)}
.spk.on .spk-b .ic{color:var(--ink)}
.spk-b b{font-size:21px;font-weight:600;white-space:nowrap}
.spk-b span{font-size:17px;color:var(--ink-2);white-space:nowrap}
.stns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;flex:1;min-height:0}
.stn{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:16px;text-align:left;border-radius:calc(var(--R) - 6px);background:var(--card-2);transition:background .2s,transform .12s;min-width:0}
.stn:active{transform:scale(.97)}
.stn.cur{background:var(--sel)}
.stn small{font-size:15px;letter-spacing:.1em;font-weight:600;color:var(--ink-3)}
.stn b{font:600 24px/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stn span{font-size:17px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stn .ic{position:absolute;top:14px;right:14px;width:26px;height:26px}
.lst{flex:1;min-height:0;display:flex;flex-direction:column}
.trk.cur{background:var(--card-2)}
.livebox{height:64px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:20px;color:var(--ink-2)}
.livepill{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px;border-radius:14px;background:var(--card-2);color:var(--ink);font-weight:600;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
.livepill i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.prog.live i{opacity:.3}
.ctrl .round:disabled{opacity:.3}

/* settings */
.settings{position:absolute;inset:0;z-index:40;background:var(--bg);display:none;padding:32px;gap:12px;grid-template-columns:268px minmax(0,1fr)}
.settings.open{display:grid;animation:sin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stage.in-set .toast{bottom:36px}
.dock-set{margin-left:8px;min-width:68px;padding:0;color:var(--ink-3)}
.settings .rail{padding:12px;gap:6px}
.settings .rail-item .row{gap:12px}
.settings .rail-item .ic{width:26px;height:26px}
.rail-gap{height:10px}
.s-back{color:var(--ink-2)}
.s-main-col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.s-head{display:flex;align-items:center;gap:16px;min-height:76px;flex:none}
.s-head h2{font:500 40px/1.05 var(--f-display);letter-spacing:-.02em}
.s-head p{font-size:20px;color:var(--ink-2);margin-top:6px}
.s-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.s-two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.s-colstack{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.s-colstack .s-row,.s-colstack .s-main{min-height:66px}
.s-card{padding:20px;display:flex;flex-direction:column;min-height:0;min-width:0}
.s-lab{font-size:17px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.s-list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;touch-action:pan-y;display:flex;flex-direction:column;gap:2px}
.s-list::-webkit-scrollbar,.s-plist::-webkit-scrollbar,.s-sh-body::-webkit-scrollbar{display:none}
.s-row{display:flex;align-items:center;gap:10px;min-height:72px;flex:none;transition:opacity .2s}
.s-row.dim{opacity:.45}
.s-main{display:flex;align-items:center;gap:16px;flex:1;min-width:0;min-height:72px;padding:0 10px;border-radius:calc(var(--R) - 6px);text-align:left;transition:background .15s}
button.s-main:hover,button.s-main:active{background:var(--card-2)}
.s-ico{width:52px;height:52px;border-radius:16px;background:var(--card-2);display:grid;place-items:center;flex:none}
.s-ico .ic{width:26px;height:26px}
.s-txt{flex:1;min-width:0}
.s-txt b{display:block;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-txt span{display:block;font-size:17px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-txt .mono{font-size:16px;color:var(--ink-3)}
.s-val{font-size:20px;color:var(--ink-2);white-space:nowrap;flex:none}
.s-chev{color:var(--ink-3);display:grid;flex:none}
.s-chev .ic{width:24px;height:24px}
.s-small{min-height:52px;padding:0 18px;font-size:18px;flex:none}
.s-small .ic{width:22px;height:22px}
.s-status{display:flex;align-items:center;gap:12px;font-size:22px;padding:4px 10px 10px}
.s-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}
.s-seg{margin:0;flex-wrap:wrap}
.s-seg button{min-width:0;padding:0 18px;height:56px}
.s-set{display:flex;flex-direction:column;gap:12px;padding:10px 10px 14px}
.s-set .s-txt b{font-size:22px}
.s-set .rng{height:48px}
.s-rooms{grid-auto-rows:200px;align-content:start;flex:1;min-height:0}
.s-rc{display:flex;flex-direction:column;gap:8px;padding:22px;text-align:left;transition:transform .12s}
.s-rc:active{transform:scale(.97)}
.s-rc b{font:500 30px/1.1 var(--f-display);letter-spacing:-.01em;margin-bottom:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-mini{display:flex;align-items:center;gap:10px;font-size:19px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-mini .ic{width:22px;height:22px;color:var(--ink-3)}
.s-addtile{align-items:center;justify-content:center;color:var(--ink-3)}
.s-addtile b{font:600 22px var(--f-body);margin:0;color:var(--ink-2)}
.s-addtile .ic{width:36px;height:36px}
/* sheets */
.s-scrim{position:absolute;inset:0;z-index:42;background:rgba(0,0,0,.55)}
.s-scrim.pick{z-index:45}
.s-sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:43;width:680px;max-height:704px;display:flex;flex-direction:column;padding:0;animation:pop .26s cubic-bezier(.2,.9,.3,1)}
.s-sheet.pick{width:760px;height:704px;z-index:46}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}
.s-sh-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 10px 28px;flex:none}
.s-sh-head h3{font:500 32px/1.1 var(--f-display);letter-spacing:-.01em}
.s-sh-head .round{background:var(--card-2)}
.s-sh-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:8px 28px 8px;display:flex;flex-direction:column;touch-action:pan-y}
.s-sh-foot{display:flex;align-items:center;gap:12px;padding:16px 28px 24px;flex:none}
.s-note{font-size:17px;color:var(--ink-2);line-height:1.25;min-width:0}
.s-field{margin-bottom:18px;flex:none}
.s-flab{font-size:17px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:10px}
.s-sub{margin:4px 0 14px}
.s-in{width:100%;height:64px;border-radius:calc(var(--R) - 6px);background:var(--card-2);color:var(--ink);font:500 24px var(--f-body);padding:0 20px;border:0;outline:0;user-select:text;-webkit-user-select:text}
.s-in::placeholder{color:var(--ink-3)}
.s-in:focus{background:var(--sel)}
.s-chipset{display:flex;flex-wrap:wrap;gap:8px}
.s-chip{height:56px;padding:0 18px;border-radius:calc(var(--R) - 6px);background:var(--card-2);font-weight:600;font-size:20px;transition:background .15s}
.s-chip.cur,.s-ib.cur{background:var(--ink);color:var(--bg)}
.s-chip:disabled{opacity:.35}
.s-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.s-ib{height:64px;border-radius:calc(var(--R) - 6px);background:var(--card-2);display:grid;place-items:center;transition:background .15s}
.s-entrow{display:flex;gap:10px;align-items:center}
.s-ent{flex:1;min-width:0;display:flex;align-items:center;gap:14px;min-height:72px;padding:0 20px;border-radius:calc(var(--R) - 6px);background:var(--card-2);text-align:left}
.s-ent .s-txt b{font-size:21px}
.s-ent>.ic{color:var(--ink-3);width:24px;height:24px}
.s-entrow .round{background:var(--card-2);width:72px;height:72px}
.s-field .s-row{min-height:72px;background:var(--card-2);border-radius:calc(var(--R) - 6px);padding-right:10px}
.s-search{position:relative;flex:none}
.s-search .ic{position:absolute;left:20px;top:18px;color:var(--ink-3)}
.s-search .s-in{padding-left:60px}
.s-plist{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;touch-action:pan-y;display:flex;flex-direction:column;gap:2px;padding-bottom:8px}
.s-chk{width:36px;height:36px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;flex:none;transition:background .15s}
.s-chk.on{background:var(--ink);color:var(--bg)}
.s-chk .ic{width:22px;height:22px}
.s-pr .s-main:disabled{cursor:default}
.btn:disabled{opacity:.35;cursor:default}

function makeSensors(){

    let seedN=(ri+3)*7919;const rnd=()=>{seedN=(seedN*9301+49297)%233280;return seedN/233280;};
    const b=base[r.id]||[20.5,48,30],hist=[],tser=[];

    tser[23]=b[0];
    out[r.id]={temp:b[0],hum:b[1],last:now-b[2]*60000,hist:hist,tser:tser};
  });
  return out;

const entOf=(id)=>HA.find((e)=>e.id===id);
const entName=(id)=>{const e=entOf(id);return e?e.name:(id||'');};

function entState(e){
  const h=Array.from(e.id).reduce((a,c)=>a+c.charCodeAt(0),0);
  if(e.cls==='temperature') return (18+h%40/10).toFixed(1)+' °C';
  if(e.cls==='humidity') return (42+h%14)+' %';
  if(e.cls==='motion') return 'Clear';

  if(e.cls==='speaker'||e.cls==='tv') return 'Idle';

function usedMap(){
  const u={};
  S.devices.forEach((d)=>{if(d.ent) u[d.ent]=d.type==='tv'?'TV':'Lights';});
  S.media.zones.forEach((z)=>{if(z.ent) u[z.ent]='Speakers';});
  S.scn.forEach((s)=>{if(s.ent) u[s.ent]='Scenes';});

  const n=name.replace(new RegExp('^'+r.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s+','i'),'');
  return n.charAt(0).toUpperCase()+n.slice(1);
}

/* ---------- editing ---------- */
function openEdit(kind,id,preset){
  let dr;
  if(kind==='light'){const d=id&&dev(id);dr=d?{name:d.name,room:d.room,icon:d.icon,ent:d.ent}:Object.assign({name:'',room:ROOMS[0].id,icon:'l-bulb',ent:''},preset);}
  if(kind==='speaker'){const z=id&&S.media.zones.find((x)=>x.id===id);dr=z?{name:z.name,room:z.id,ent:z.ent}:Object.assign({name:'',room:(freeRooms()[0]||{}).id,ent:''},preset);}
  if(kind==='scene'){const s=id&&S.scn.find((x)=>x.id===id);dr=s?{name:s.name,icon:s.icon,ent:s.ent,show:s.show}:Object.assign({name:'',icon:'sparkles',ent:'',show:true},preset);}
  if(kind==='room'){const r=id&&ROOMS.find((x)=>x.id===id),m=(id&&S.map[id])||{};dr=r?{name:r.name,temp:m.temp||'',hum:m.hum||'',motion:m.motion||''}:{name:'',temp:'',hum:'',motion:''};}
  S.edit={kind:kind,id:id||null,isNew:!id,draft:dr};
}
function roomRemovable(id){return !S.devices.some((d)=>d.room===id)&&!S.media.zones.some((z)=>z.id===id)&&ROOMS.length>1;}
function saveEdit(){
  const e=S.edit,dr=e.draft,name=(dr.name||'').trim(),k=e.kind;
  if(!name){toast('Give it a name first');return;}
  if(k==='light'){
    if(!dr.ent){toast('Choose a Home Assistant entity first');return;}
    if(e.id) Object.assign(dev(e.id),{name:name,room:dr.room,icon:dr.icon,ent:dr.ent});
    else S.devices.push({id:'x'+(Date.now()%1e7),type:'light',ent:dr.ent,room:dr.room,name:name,icon:dr.icon,on:false,level:60,warm:60,w:10});
  }
  if(k==='speaker'){
    if(!dr.room){toast('Every room already has a speaker');return;}
    if(!dr.ent){toast('Choose a Home Assistant entity first');return;}
    const z=e.id&&S.media.zones.find((x)=>x.id===e.id);
    if(z){z.id=dr.room;z.name=name;z.ent=dr.ent;} else S.media.zones.push({id:dr.room,name:name,ent:dr.ent,on:false,vol:25});
  }
  if(k==='scene'){
    const s=e.id&&S.scn.find((x)=>x.id===e.id),others=S.scn.filter((x)=>x.show&&x!==s).length;
    let show=dr.show;if(show&&others>=MAX_SCENES){show=false;toast('Saved, but hidden. The panel shows up to '+MAX_SCENES+' scenes.');}
    if(s) Object.assign(s,{name:name,icon:dr.icon,ent:dr.ent,show:show});
    else S.scn.push({id:'c'+(Date.now()%1e7),name:name,icon:dr.icon,ent:dr.ent,show:show,builtin:false,desc:'Runs in Home Assistant.'});
  }
  if(k==='room'){
    const short=name.length>9?name.split(' ')[0]:name;
    if(e.id){const r=ROOMS.find((x)=>x.id===e.id);r.name=name;r.short=short;S.map[e.id]={temp:dr.temp,hum:dr.hum,motion:dr.motion};}
    else{const id='r'+(Date.now()%1e7);ROOMS.push({id:id,name:name,short:short});S.map[id]={temp:dr.temp,hum:dr.hum,motion:dr.motion};S.sensors[id]=makeSensors()[id];}
  }
  S.edit=null;render();
}
function removeEdit(){
  const e=S.edit,k=e.kind,id=e.id,nm=e.draft.name||'Item';
  S.edit=null;
  if(k==='light') return withUndo(nm+' removed from the panel',()=>{S.devices=S.devices.filter((d)=>d.id!==id);});
  if(k==='speaker') return withUndo(nm+' speaker removed',()=>{S.media.zones=S.media.zones.filter((z)=>z.id!==id);});
  if(k==='scene'){S.scn=S.scn.filter((s)=>s.id!==id);toast(nm+' removed');return render();}
  if(k==='room'){
    ROOMS.splice(ROOMS.findIndex((r)=>r.id===id),1);delete S.map[id];delete S.sensors[id];
    if(S.room===id) S.room='all';
    if(S.rroom===id) S.rroom=ROOMS[0].id;
    toast(nm+' removed');render();
  }
}

/* ---------- picking entities ---------- */
function openPick(o){S.pick=Object.assign({q:'',sel:[],all:false,multi:false,cta:'Use entity',current:''},o);}
function pickDone(){
  const p=S.pick,sel=p.sel.slice();if(!sel.length) return;
  S.pick=null;
  if(p.kind==='field'){S.edit.draft[p.field]=sel[0];}
  else if(p.kind==='lights'){
    sel.forEach((ent)=>{const pre=lightPreset(ent);S.devices.push({id:'x'+(Date.now()%1e7)+Math.floor(Math.random()*99),type:'light',ent:ent,room:pre.room,name:pre.name,icon:pre.icon,on:false,level:60,warm:60,w:10});});
    S.set.filter='all';toast('Added '+plural(sel.length,'light')+'. Tap one to change its room or name.');
  }
  else if(p.kind==='speaker'){const pre=speakerPreset(sel[0]);if(pre) openEdit('speaker',null,pre);}
  else if(p.kind==='scene'){openEdit('scene',null,{ent:sel[0],name:entName(sel[0]),icon:'sparkles',show:true});}
  render();
}
function addEntity(ent){
  const e=entOf(ent);
  if(e.dom==='light') openEdit('light',null,lightPreset(ent));
  else if(e.cls==='speaker'){const pre=speakerPreset(ent);if(!pre){toast('Every room already has a speaker. Remove one first.');return;}openEdit('speaker',null,pre);}
  else openEdit('scene',null,{ent:ent,name:e.name,icon:'sparkles',show:true});
}

function pickSheet(){
  const p=S.pick,used=usedMap(),doms=p.dom.split(',');

  const body='<div class="s-search">'+ic('search')+'<input class="s-in" id="pq" data-field="__q" type="text" value="'+esc(p.q)+'" placeholder="Search by name or entity id" autocomplete="off"></div>'+

  return sSheet(p.title,body,foot,'pick-close','pick');

/* ---------- actions ---------- */
function sAct(act,a){
  switch(act){
    case 'open':S.set={sec:'overview',filter:'all'};break;
    case 'close':S.set=null;S.edit=null;S.pick=null;break;
    case 'sec':S.set.sec=a;S.set.filter='all';break;
    case 'filter':S.set.filter=a;break;
    case 'edit':{const p=a.split(':');openEdit(p[0],p[1]);break;}
    case 'new':
      if(a==='lights') openPick({kind:'lights',title:'Add lights',dom:'light',cls:'',multi:true,cta:'Add'});
      else if(a==='speaker'){if(!freeRooms().length){toast('Every room already has a speaker.');return;}openPick({kind:'speaker',title:'Choose a speaker',dom:'media_player',cls:'speaker'});}
      else if(a==='scene') openPick({kind:'scene',title:'Choose a scene or script',dom:'scene,script',cls:'',cta:'Continue'});
      else if(a==='room') openEdit('room',null);
      break;
    case 'addent':addEntity(a);break;
    case 'edit-close':S.edit=null;break;
    case 'edit-save':return saveEdit();
    case 'edit-remove':return removeEdit();
    case 'fset':{const i=a.indexOf(':');S.edit.draft[a.slice(0,i)]=a.slice(i+1);break;}
    case 'ftoggle':S.edit.draft[a]=!S.edit.draft[a];break;
    case 'fclear':S.edit.draft[a]='';break;
    case 'pickent':{const p=a.split('|');openPick({kind:'field',field:p[0],dom:p[1],cls:p[2],title:p[3],current:S.edit.draft[p[0]]||'',sel:S.edit.draft[p[0]]?[S.edit.draft[p[0]]]:[],all:false});break;}
    case 'pick-close':S.pick=null;break;
    case 'pick-ok':return pickDone();
    case 'pickfilter':S.pick.all=a==='all';break;
    case 'row':{const p=S.pick,i=p.sel.indexOf(a);if(p.multi){if(i>=0)p.sel.splice(i,1);else p.sel.push(a);}else p.sel=i>=0?[]:[a];break;}
    case 'sync':S.syncAt=Date.now();toast('Synced '+HA_TOTAL+' entities from Home Assistant');break;
    case 'stn':{const s=STATIONS[+a];s.show=s.show===false;break;}
    case 'scnshow':{const s=S.scn.find((x)=>x.id===a);if(!s.show&&visScenes().length>=MAX_SCENES){toast('The panel shows up to '+MAX_SCENES+' scenes. Hide one first.');return;}s.show=!s.show;break;}
    case 'theme':S.disp.theme=a;applyDisp();break;
    case 'clock':S.disp.h12=a==='12';break;
    case 'sleep':S.disp.sleep=+a;break;
    case 'reset':{const keep=S.tab;S=seed();S.tab=keep;S.set={sec:'display',filter:'all'};applyDisp();toast('Settings reset');break;}
  }
  render();
}
document.addEventListener('click',(e)=>{
  const t=e.target.closest('[data-s]');if(!t||t.disabled) return;
  sAct(t.dataset.s,t.dataset.a);
});
document.addEventListener('input',(e)=>{
  const f=e.target.closest&&e.target.closest('[data-field]');if(!f) return;
  if(f.dataset.field==='__q'){S.pick.q=f.value;render();}
  else if(S.edit) S.edit.draft[f.dataset.field]=f.value;
});
document.addEventListener('keydown',(e)=>{
  if(!S.set) return;
  if(e.key==='Escape'){if(S.pick) S.pick=null; else if(S.edit) S.edit=null; else S.set=null;render();}
  if(e.key==='Enter'&&S.edit&&!S.pick&&e.target.closest&&e.target.closest('.s-in')) saveEdit();
});

/* ---------- state changes ---------- */
let undoFn=null,toastT=null;
function toast(msg,undo){
  const t=$('#toast');undoFn=undo||null;
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">'+ic('undo')+'Undo</button>':'');
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),6000);
}
function withUndo(msg,fn){
  const snap=JSON.stringify({d:S.devices,m:S.media}),prev=S.lastScene;
  fn();
  toast(msg,()=>{const o=JSON.parse(snap);S.devices=o.d;S.media=o.m;S.lastScene=prev;render();});
  render();
}
const set=(id,p)=>Object.assign(dev(id),p);
const allOff=()=>lights().forEach((d)=>{d.on=false;});
const zone=(id,p)=>Object.assign(S.media.zones.find((z)=>z.id===id),p);
function runScene(id){
  const sc=S.scn.find((s)=>s.id===id);
  if(!sc.builtin) return withUndo(sc.name+' is on',()=>{S.lastScene=id;});
  withUndo(sc.name+' is on',()=>{
    allOff();
    if(id==='morning'){set('worktop',{on:true,level:100,warm:30});set('pend',{on:true,level:70,warm:50});set('hall',{on:true,level:50,warm:60});zone('kitchen',{on:true,vol:30});S.media.source='radio';S.media.st=1;S.media.playing=true;}
    if(id==='dinner'){set('pend',{on:true,level:80,warm:80});set('worktop',{on:true,level:60,warm:70});set('lamp',{on:true,level:30,warm:95});set('shelf',{on:true,level:35,warm:95});zone('kitchen',{on:true,vol:20});zone('living',{on:true,vol:20});S.media.source='lib';S.media.i=2;S.media.pos=0;S.media.playing=true;}
    if(id==='relax'){set('lamp',{on:true,level:40,warm:95});set('shelf',{on:true,level:35,warm:95});set('tv',{on:false});}
    if(id==='movie'){set('lamp',{on:true,level:20,warm:95});set('tv',{on:true});S.media.playing=false;}
    if(id==='night'){set('bedside',{on:true,level:15,warm:95});set('tv',{on:false});S.media.playing=false;}
    if(id==='off'){set('tv',{on:false});S.media.playing=false;}
    S.lastScene=id;
  });
}
function toggleDevice(id){const d=dev(id);d.on=!d.on;render();}
function scope(){return S.room==='all'?lights():roomLights(S.room);}
const PRESETS={bright:{level:100,warm:35,label:'Bright'},relax:{level:40,warm:90,label:'Relax'},night:{level:10,warm:100,label:'Night'}};
function applyPreset(k){
  const p=PRESETS[k],name=S.room==='all'?'All lights':ROOMS.find((r)=>r.id===S.room).name;
  withUndo(p.label+' in '+name.toLowerCase(),()=>{scope().forEach((d)=>{d.on=true;d.level=p.level;d.warm=p.warm;});});
}
function roomToggle(id){
  const ls=roomLights(id),any=ls.some((l)=>l.on),r=ROOMS.find((x)=>x.id===id);
  withUndo(r.name+' lights '+(any?'off':'on'),()=>{ls.forEach((l)=>{l.on=!any;});});
}

/* ---------- media ---------- */
function ensureZone(){if(!S.media.zones.some((z)=>z.on)) zone('kitchen',{on:true});}
function play(){const m=S.media;if(!m.playing) ensureZone();m.playing=!m.playing;render();}
function pick(dir,auto){
  const m=S.media;
  if(auto&&m.repeat){m.pos=0;return;}
  if(m.shuffle&&dir>0){let n=m.i;while(n===m.i) n=Math.floor(Math.random()*TRACKS.length);m.i=n;}
  else m.i=(m.i+dir+TRACKS.length)%TRACKS.length;
  m.pos=0;
}
function skip(dir){const m=S.media;if(m.source==='radio') m.st=(m.st+dir+STATIONS.length)%STATIONS.length;else pick(dir,false);render();}
function playStation(k){const m=S.media;m.source='radio';m.st=k;m.playing=true;ensureZone();render();}
function playTrack(i){const m=S.media;m.source='lib';m.i=i;m.pos=0;m.playing=true;ensureZone();render();}
function groupAll(){const m=S.media;m.zones.forEach((z)=>{z.on=true;});if(!m.playing){m.playing=true;}toast('Playing in every room');render();}

/* ---------- navigation ---------- */
const view=$('#view'),stage=$('#stage');
let scale=1;
const tabIndex=(id)=>TABS.findIndex((t)=>t.id===id);
function setTab(id,picker){
  if(id===S.tab) return;
  const dir=tabIndex(id)-tabIndex(S.tab);
  S.tab=id;S.picker=!!picker;
  view.classList.remove('slide-l','slide-r');void view.offsetWidth;view.classList.add(dir>0?'slide-l':'slide-r');
  render();
}
function moveTab(dir){const i=tabIndex(S.tab)+dir;if(i>=0&&i<TABS.length) setTab(TABS[i].id);}
function fit(){const f=$('#fit');scale=Math.min(f.clientWidth/1280,f.clientHeight/800)||1;stage.style.setProperty('--s',scale);}
const mq=window.matchMedia('(prefers-color-scheme: dark)');
function theme(){const cur=document.documentElement.getAttribute('data-theme')||(mq.matches?'dark':'light');document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');S.disp.theme=cur==='dark'?'light':'dark';}

function render(){
  paint(view,VIEWS[S.tab]());
  paint($('#dock'),dockHtml());paint($('#picker'),pickerHtml());
  renderSettings();
}

/* ---------- sleep mode ---------- */
let lastTouch=Date.now(),driftT=0;
function ambientFill(){
  const d=new Date(),on=lights().filter((x)=>x.on).length,pr=playingRooms();
  $('#amb-t').textContent=hhmm(d.getTime());
  $('#amb-d').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  $('#amb-a').innerHTML='<span>'+(on?plural(on,'light')+' on':'Lights off')+'</span>'+(pr.length?'<span>Playing in '+esc(pr[0].name)+(pr.length>1?' and more':'')+'</span>':'');
}
function showAmbient(){ambientFill();$('#ambient').classList.add('show');}
function wake(){lastTouch=Date.now();}

/* ---------- swipe between tabs ---------- */
let swipe=null,justSwiped=false;
document.addEventListener('pointerdown',(e)=>{
  if($('#ambient').classList.contains('show')){e.stopPropagation();e.preventDefault();$('#ambient').classList.remove('show');wake();return;}
  wake();
  if(e.target.closest('input,.dock,.picker,#settings')||!e.target.closest('#stage')) return;
  swipe={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId,drag:false,dx:0};
},true);
document.addEventListener('pointermove',(e)=>{
  if(!swipe||e.pointerId!==swipe.id) return;
  const dx=(e.clientX-swipe.x)/scale,dy=(e.clientY-swipe.y)/scale;
  if(!swipe.drag){
    if(Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)*1.4){swipe.drag=true;view.style.transition='none';}
    else return;
  }
  swipe.dx=dx;
  const i=tabIndex(S.tab),edge=(dx>0&&i===0)||(dx<0&&i===TABS.length-1),f=edge?0.12:0.4;
  view.style.transform='translateX('+(dx*f).toFixed(1)+'px)';
  view.style.opacity=String(1-Math.min(Math.abs(dx)*f/300,0.4));
});
function endSwipe(e){
  if(!swipe||e.pointerId!==swipe.id) return;
  const s=swipe;swipe=null;
  if(!s.drag) return;
  view.style.transition='transform .25s,opacity .25s';view.style.transform='';view.style.opacity='';
  setTimeout(()=>{view.style.transition='';},280);
  justSwiped=true;setTimeout(()=>{justSwiped=false;},60);
  const dt=Math.max(1,Date.now()-s.t),commit=Math.abs(s.dx)>120||(Math.abs(s.dx)/dt>0.5&&Math.abs(s.dx)>45);
  if(commit) moveTab(s.dx<0?1:-1);
}
document.addEventListener('pointerup',endSwipe);
document.addEventListener('pointercancel',endSwipe);

/* ---------- taps ---------- */
document.addEventListener('click',(e)=>{
  if(justSwiped) return;
  const t=e.target.closest('[data-toggle],[data-tab],[data-scene],[data-room],[data-skip],[data-play],[data-alloff],[data-roomall],[data-roomtoggle],[data-preset],[data-warm],[data-zone],[data-shuffle],[data-repeat],[data-track],[data-station],[data-playlist],[data-mtab],[data-groupall],[data-rroom],[data-roomoff],[data-act]');
  if(!t) return;
  const D=t.dataset;
  if(D.toggle) return toggleDevice(D.toggle);
  if(D.tab){if(D.tab==='rooms'&&S.tab==='rooms'){S.picker=!S.picker;return render();}return setTab(D.tab,D.tab==='rooms');}
  if(D.rroom){S.rroom=D.rroom;S.picker=false;return render();}
  if(D.roomoff){const rr=ROOMS.find((x)=>x.id===D.roomoff);return withUndo(rr.name+' is off',()=>{roomLights(rr.id).forEach((l)=>{l.on=false;});if(rr.id==='living') dev('tv').on=false;});}
  if(D.scene) return runScene(D.scene);
  if(D.room){S.room=D.room;return render();}
  if(D.skip) return skip(+D.skip);
  if(D.play) return play();
  if(D.alloff) return withUndo('All lights are off',()=>{allOff();});
  if(D.roomall) return withUndo((S.room==='all'?'All lights':ROOMS.find((r)=>r.id===S.room).name+' lights')+' off',()=>{scope().forEach((d)=>{d.on=false;});});
  if(D.roomtoggle) return roomToggle(D.roomtoggle);
  if(D.preset) return applyPreset(D.preset);
  if(D.warm){const p=D.warm.split(':'),d=dev(p[0]);d.warm=+p[1];d.on=true;return render();}
  if(D.zone){const z=S.media.zones.find((x)=>x.id===D.zone);z.on=!z.on;return render();}
  if(D.shuffle){S.media.shuffle=!S.media.shuffle;return render();}
  if(D.repeat){S.media.repeat=!S.media.repeat;return render();}
  if(D.track) return playTrack(+D.track);
  if(D.station) return playStation(+D.station);
  if(D.playlist) return playTrack(+D.playlist);
  if(D.mtab){S.media.mtab=D.mtab;return render();}
  if(D.groupall) return groupAll();
  switch(D.act){
    case 'close-picker':S.picker=false;return render();
    case 'theme':return theme();
    case 'undo':if(undoFn){undoFn();undoFn=null;$('#toast').classList.remove('show');}return;
    case 'demo-sleep':return showAmbient();
    case 'demo-reset':{S=seed();applyDisp();render();return;}
  }
});
document.addEventListener('input',(e)=>{
  const r=e.target.closest('[data-range]');if(!r) return;
  const p=r.dataset.range.split(':'),v=Number(r.value);
  if(p[0]==='bright'){S.disp.bright=v;applyDisp();}
  else if(p[0]==='seek') S.media.pos=v;
  else if(p[0].indexOf('z-')===0){const z=S.media.zones.find((x)=>x.id===p[0].slice(2));z.vol=v;if(v>0) z.on=true;}
  else{const d=dev(p[0]);d[p[1]]=v;if(d.type==='light') d.on=true;}
  render();
});
document.addEventListener('keydown',(e)=>{
  wake();
  if(e.target.closest&&e.target.closest('input')) return;
  if(S.set) return;
  if(e.key==='ArrowRight') moveTab(1);
  if(e.key==='ArrowLeft') moveTab(-1);
});

/* ---------- live simulation ---------- */
function tick(){
  const m=S.media;
  Object.keys(S.sensors).forEach((k)=>{const sn=S.sensors[k];sn.temp=+clamp(sn.temp+(Math.random()-0.5)*0.03,16,26).toFixed(2);sn.tser[23]=sn.temp;});
  if(Math.random()<0.06){const sn=S.sensors[ROOMS[Math.floor(Math.random()*ROOMS.length)].id];sn.last=Date.now();sn.hist[11]++;}
  if(playingRooms().length&&m.source!=='radio'){m.pos+=1.5;if(m.pos>=TRACKS[m.i][2]) pick(1,true);}
  const amb=$('#ambient').classList.contains('show');
  if(!amb&&!S.set&&S.disp.sleep&&Date.now()-lastTouch>S.disp.sleep*1000) showAmbient();
  if(amb){ambientFill();if(Date.now()-driftT>20000){driftT=Date.now();const dr=$('#drift');dr.style.setProperty('--dx',(Math.random()*80-40)+'px');dr.style.setProperty('--dy',(Math.random()*60-30)+'px');}}
  render();
}
fit();
if(window.ResizeObserver) new ResizeObserver(fit).observe($('#fit')); else window.addEventListener('resize',fit);
render();
setInterval(tick,1500);
})();
</script>

</body></html>
